name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: git clone --depth 1 https://github.com/ehudreiter/accuracySharedTask /tmp/ast
      - run: python benchmarks/inlg2021/run.py /tmp/ast | tee bench.json
      - name: results match the committed numbers
        run: python -c "import json;a=json.load(open('bench.json'));b=json.load(open('benchmarks/inlg2021/results.json'));assert a==b, 'benchmark drifted: update results.json'"
